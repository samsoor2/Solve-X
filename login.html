<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Solve X — Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(45,110,255,.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(130,70,255,.18),
          transparent 32%
        ),
        #050914;
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 34px;

      border-radius: 22px;

      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.11);

      box-shadow:
        0 25px 70px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #61a9ff;
    }

    .subtitle {
      text-align: center;
      color: #929eb2;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: #c5cfdd;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;

      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.13);

      background: rgba(0,0,0,.25);
      color: white;

      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #5da9ff;
    }

    .main-button {
      width: 100%;
      padding: 14px;

      margin-top: 22px;

      border: 0;
      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #287cff,
          #7b42ff
        );

      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .forgot {
      display: block;

      width: auto;

      margin: 14px auto 0;

      padding: 0;

      border: 0;

      background: transparent;

      color: #65aaff;

      font-size: 14px;
      cursor: pointer;
    }

    .switch {
      margin-top: 20px;

      text-align: center;

      color: #8d99ad;

      font-size: 14px;
    }

    .switch button {
      width: auto;

      margin-top: 8px;

      padding: 0;

      border: 0;

      background: transparent;

      color: #65aaff;

      font-size: 14px;

      cursor: pointer;
    }

    #message {
      min-height: 22px;

      margin-top: 16px;

      text-align: center;

      color: #9de4bf;

      font-size: 14px;

      line-height: 1.5;
    }

    .back {
      display: block;

      margin-top: 20px;

      text-align: center;

      color: #78869b;

      text-decoration: none;

      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Solve<span>X</span>
    </div>

    <div
      class="subtitle"
      id="subtitle"
    >
      Login to your Solve X account
    </div>


    <!-- =========================
         LOGIN / SIGNUP FORM
         ========================= -->

    <form id="authForm">

      <div
        id="nameBox"
        class="hidden"
      >

        <label>
          Full name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your full name"
        >

      </div>


      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >


      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="At least 6 characters"
        minlength="6"
        required
      >


      <button
        id="submitButton"
        class="main-button"
        type="submit"
      >
        Login
      </button>


      <button
        id="forgotPassword"
        class="forgot"
        type="button"
      >
        Forgot password?
      </button>

    </form>


    <!-- =========================
         NEW PASSWORD FORM
         ========================= -->

    <form
      id="resetForm"
      class="hidden"
    >

      <label>
        New password
      </label>

      <input
        id="newPassword"
        type="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >


      <label>
        Confirm new password
      </label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Repeat new password"
        minlength="6"
        required
      >


      <button
        id="resetButton"
        class="main-button"
        type="submit"
      >
        Set New Password
      </button>

    </form>


    <div id="message"></div>


    <!-- =========================
         LOGIN / SIGNUP SWITCH
         ========================= -->

    <div
      id="switchArea"
      class="switch"
    >

      <span id="switchText">
        Don't have an account?
      </span>

      <button
        id="switchButton"
        type="button"
      >
        Create account
      </button>

    </div>


    <a
      class="back"
      href="index.html"
    >
      ← Back to Solve X
    </a>

  </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://ettgqoyssaonfzsolhsp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_adq0Y_WHIQ_MfQVwkBi-Ra-I4QWYkPa";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


// ================================
// ELEMENTS
// ================================

const authForm = document.getElementById("authForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");


// ================================
// MESSAGE
// ================================

function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error
    ? "#ff8d8d"
    : "#9de4bf";
}


// ================================
// LOGIN
// ================================

authForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  submitButton.disabled = true;

  showMessage("Logging in...");

  try {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {
      throw new Error(
        "Please enter your email and password."
      );
    }


    // LOGIN
    const {
      data,
      error
    } = await client.auth.signInWithPassword({
      email: email,
      password: password
    });


    if (error) {
      throw error;
    }


    // CHECK SESSION
    const {
      data: sessionData,
      error: sessionError
    } = await client.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData.session) {
      throw new Error(
        "Login succeeded, but session was not found."
      );
    }


    console.log(
      "LOGIN SUCCESS:",
      sessionData.session.user.email
    );


    showMessage(
      "Login successful. Redirecting..."
    );


    // IMPORTANT:
    // مستقیم index.html ته ځي
    window.location.replace("index.html");


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    showMessage(
      error?.message ||
      "Login failed.",
      true
    );

    submitButton.disabled = false;

  }

});


// ================================
// CHECK EXISTING SESSION
// ================================

async function checkExistingSession() {

  try {

    const {
      data,
      error
    } = await client.auth.getSession();


    if (error) {
      console.error(
        "SESSION CHECK ERROR:",
        error
      );
      return;
    }


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      console.log(
        "Existing session:",
        data.session.user.email
      );

      window.location.replace("index.html");

    }

  } catch (error) {

    console.error(
      "EXISTING SESSION ERROR:",
      error
    );

  }

}


// Run when page opens
checkExistingSession();

</script>  

      

        
                


  

</body>
</html>
