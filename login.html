<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — SolveX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(50,100,255,.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(130,60,255,.18), transparent 30%),
        #050914;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 22px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #5da9ff;
    }

    .subtitle {
      text-align: center;
      color: #8f9bb0;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c8d1df;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #5d9cff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg,#287cff,#7b42ff);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      color: #8996aa;
      font-size: 14px;
    }

    .switch a {
      color: #70adff;
      cursor: pointer;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8996aa;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Solve<span>X</span>
    </div>

    <div class="subtitle" id="subtitle">
      Welcome back. Login to SolveX.
    </div>

    <form id="authForm">

      <div id="nameField" style="display:none;">
        <label>Full name</label>
        <input
          id="name"
          type="text"
          placeholder="Your full name"
        >
      </div>

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Your password"
        minlength="6"
        required
      >

      <button type="submit" id="submitBtn">
        Login
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="switch">
      <span id="switchText">Don't have an account?</span>
      <a id="switchBtn">Create account</a>
    </div>

    <a href="index.html" class="back">
      ← Back to SolveX
    </a>

  </div>


  <script>

    const form = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const switchText = document.getElementById("switchText");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");

    let signupMode = false;

    switchBtn.addEventListener("click", () => {

      signupMode = !signupMode;

      message.textContent = "";

      if (signupMode) {

        nameField.style.display = "block";
        nameInput.required = true;

        submitBtn.textContent = "Create account";
        switchText.textContent = "Already have an account?";
        switchBtn.textContent = "Login";
        subtitle.textContent = "Create your SolveX account.";

      } else {

        nameField.style.display = "none";
        nameInput.required = false;

        submitBtn.textContent = "Login";
        switchText.textContent = "Don't have an account?";
        switchBtn.textContent = "Create account";
        subtitle.textContent = "Welcome back. Login to SolveX.";
      }

    });


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        message.textContent = "Please complete all required fields.";
        return;
      }

      submitBtn.disabled = true;
      message.textContent = "Connecting...";

      /*
        Supabase authentication will be connected
        in the next step.
      */

      setTimeout(() => {

        message.textContent =
          signupMode
          ? "Signup connection is ready for Supabase."
          : "Login connection is ready for Supabase.";

        submitBtn.disabled = false;

      }, 800);

    });

  </script>

</body>
</html>
